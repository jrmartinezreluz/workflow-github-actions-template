# Reusable: gitleaks on the caller checkout (PR + main).
# Canonical copy: workflow-github-actions. Keep app copies in sync until that GitHub repo exists.
name: Secret scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /src --redact --exit-code 1 --no-banner
